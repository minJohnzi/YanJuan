<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>研卷台｜考研英语一真题学习系统</title>
    <meta name="description" content="以考研英语一历年真题为核心的结构化精读、整卷模拟、两阶段主观题批改与间隔复习系统（Yanjuan Desk）。" />
    <meta property="og:title" content="研卷台｜考研英语一真题学习系统" />
    <meta property="og:description" content="以考研英语一历年真题为核心的结构化精读、整卷模拟、两阶段主观题批改与间隔复习系统（Yanjuan Desk）。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('yanjuan_theme_mode') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F1F5F3] dark:bg-[#131B1E] text-[#202B2F] dark:text-[#E2E8E6] antialiased selection:bg-[#174A5B]/15 dark:selection:bg-[#38849E]/30 selection:text-[#202B2F] dark:selection:text-[#E2E8E6]">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          params.delete('__aistudio_auth_token');
          var search = params.toString();
          var path = window.location.pathname;
          var targetPath = (!path || path === '/YANJUAN') ? '/' : path;
          var nextUrl = search ? (targetPath === '/' ? '/?' + search : targetPath + '?' + search) : targetPath;
          if (window.location.pathname + window.location.search !== nextUrl) {
            window.history.replaceState(null, '', nextUrl);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
